# F-12: cargo-deny configuration. Run `cargo deny check` in CI to fail builds
# that pull in vulnerable, yanked, or unmaintained crates.

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Pre-0.4 num-bigint is unmaintained upstream.
    { name = "num-bigint", version = "<0.4" },
    # 2014 single-author crate, replaced by `base64`.
    { name = "base64url" },
]

[licenses]
# TLS code is intended to be liberally licensed; keep the set narrow.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
